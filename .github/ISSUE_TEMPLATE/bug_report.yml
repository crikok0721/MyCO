name: Bug report
description: Report a reproducible MyCO defect without private conversation data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach credentials, cookies, real conversations, or unreviewed logs.
  - type: input
    id: version
    attributes:
      label: MyCO version
      placeholder: 0.99.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and Desktop version
      placeholder: Windows 11 24H2; Codex/ChatGPT Desktop version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic content only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed conversation text, credentials, tokens, cookies, and personal paths.
          required: true
